# =============================================================================
# SITE CONFIG — update `url` when you connect a custom domain on GitHub Pages
# =============================================================================
title: Sepehr Khavari
tagline: Mechanical Engineering & Neuroscience · Builder · Researcher
description: >-
  Dual accelerated M.S./B.S. in Mechanical Engineering and Neuroscience at
  Northwestern University. Medical devices, orthopedics, functional neurosurgery,
  startups, and thoughtful engineering.

# Production URL (no trailing slash). Custom domain for GitHub Pages — see docs/CNAME.
url: "https://sepehr.co.us"
baseurl: ""

locale: en_US
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Resume opens in a new tab — replace the filename after you add your real PDF
# (see docs/assets/documents/README.md)
resume_pdf_path: "/assets/documents/resume.pdf"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - assets/js/crossword-layout-test.mjs

sass:
  quiet_deps: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
