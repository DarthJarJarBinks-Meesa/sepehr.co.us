# =============================================================================
# SITE CONFIG — update `url` when you connect a custom domain on GitHub Pages
# =============================================================================
title: Sepehr Khavari
tagline: Mechanical Engineering & Neuroscience · Builder · Researcher
description: >-
  Dual accelerated M.S./B.S. in Mechanical Engineering and Neuroscience at
  Northwestern University. Medical devices, orthopedics, functional neurosurgery,
  startups, and thoughtful engineering.

# Production URL for GitHub Pages project site.
# Switch back to your custom domain later (e.g., url: "https://sepehr.co.us", baseurl: "").
url: "https://darthjarjarbinks-meesa.github.io"
baseurl: "/sepehr.co.us"

locale: en_US
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

resume_pdf_path: "/assets/documents/resume.pdf"

# Side decorative art (path from site root). Right side is the same asset, flipped in CSS.
edge_art_left: "/assets/images/left_background.svg"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - assets/js/crossword-layout-test.mjs

sass:
  quiet_deps: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
